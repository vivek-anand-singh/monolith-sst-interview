{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "interview-monolith.name" . }}
  labels:
    {{- include "interview-monolith.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "interview-monolith.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # The Ingress controller is the only way in for users.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8000 }
    # Prometheus scrapes the management port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 8081 }
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if .Values.tracing.enabled }}
    # Traces to Tempo
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
      ports:
        - { protocol: TCP, port: 4318 }
    {{- end }}
    # The database and Google live outside the cluster, so they cannot be selected by label; restrict by port.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        {{- range .Values.networkPolicy.externalEgressPorts }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
