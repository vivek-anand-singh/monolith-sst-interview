apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "interview-monolith.name" . }}
  labels:
    {{- include "interview-monolith.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "interview-monolith.selectorLabels" . | nindent 6 }}
