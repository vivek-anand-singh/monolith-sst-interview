apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "interview-monolith.name" . }}
  labels:
    {{- include "interview-monolith.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "interview-monolith.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "interview-monolith.labels" . | nindent 8 }}
      annotations:
        # A config change rolls the pods; env vars are only read at start-up.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "interview-monolith.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas over nodes so one node failure does not take every pod.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "interview-monolith.selectorLabels" . | nindent 14 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ required "image.tag (the commit SHA) must be set" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: {{ include "interview-monolith.name" . }}
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Start-up (Flyway + Hikari to a remote DB) can be slow; liveness only starts counting once this passes.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          # Readiness is app-state only. The DB is deliberately not part of it: a Neon blip or cold start
          # should not pull every pod out of the Service at once. DB health is watched through metrics instead.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give the Service/Ingress time to stop routing here before Spring starts its graceful shutdown.
              exec:
                command: ["sleep", "10"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
