apiVersion: v1
kind: Service
metadata:
  name: {{ include "interview-monolith.name" . }}
  labels:
    {{- include "interview-monolith.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "interview-monolith.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
