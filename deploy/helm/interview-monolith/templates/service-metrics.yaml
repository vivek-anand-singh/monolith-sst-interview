{{- if .Values.monitoring.enabled }}
# A separate Service for the management port, so Prometheus can scrape it without it ever being routed by the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "interview-monolith.name" . }}-metrics
  labels:
    {{- include "interview-monolith.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    {{- include "interview-monolith.selectorLabels" . | nindent 4 }}
  ports:
    - name: management
      port: 8081
      targetPort: management
{{- end }}
