# Throwaway PostgreSQL for the CD smoke test only. Credentials are not secret: the cluster lives for one workflow run.
# It runs in the "interview" namespace, so it must satisfy the same Pod Security "restricted" profile as the app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-postgres
  template:
    metadata:
      labels:
        app: smoke-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_DB, value: interview }
            - { name: POSTGRES_USER, value: smoke }
            - { name: POSTGRES_PASSWORD, value: smoke }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "smoke", "-d", "interview"]
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-postgres
spec:
  selector:
    app: smoke-postgres
  ports:
    - port: 5432
