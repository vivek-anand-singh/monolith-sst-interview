kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: interview
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Host 8080 -> ingress controller on the node, so http://interview.localtest.me:8080 works without sudo.
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
