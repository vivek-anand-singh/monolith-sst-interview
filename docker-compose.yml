services:

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: interview
      POSTGRES_USER: ${DB_USERNAME:-interviewuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-interviewuser} -d interview"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      network: host
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/interview
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      # The image has no curl; probe the health endpoint over a raw TCP connection instead.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
