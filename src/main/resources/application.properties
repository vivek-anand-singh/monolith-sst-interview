spring.application.name=interview-backend
spring.config.import=optional:file:./.env[.properties]

server.port=8000
# Finish in-flight requests on SIGTERM so a rolling update does not drop them.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/interview}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# How long a request waits for a pooled connection before failing. 60s suits a cold-starting Neon on a laptop;
# the Helm chart lowers it so a database outage shows up as fast 5xx instead of minute-long hangs.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:60000}
spring.datasource.hikari.initialization-fail-timeout=120000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET}

google.client-id=${GOOGLE_CLIENT_ID}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator lives on its own port so it is never reachable through the public port or the Ingress.
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.revision=${GIT_SHA:unknown}
# Tracing: every request gets a trace id (it appears in the JSON logs). Export over OTLP is off until the
# deployment points it at a collector (see the Helm chart's tracing values); metrics are scraped, not pushed.
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s

logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.com.sstinterview=DEBUG

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=true
